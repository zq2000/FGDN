# FGDN training config on DID-Data (paper Sec. 4.1.3 protocol)
# Train: python basicsr/train.py -opt options/DID-Data.yml
#   AdamW (lr 3e-4, wd 1e-4), L1 loss, batch 8, 128x128 patch, 300k iters,
#   cosine restarts [92k, 208k] -> 1e-6, random geometric augmentation (8 rigid
#   transforms), seed 0. Expected: PSNR 35.46 dB / 0.9655 (Y channel). DID-Data: rain streaks with diverse densities and shapes.

# general settings
name: Deraining_DID_Data
model_type: ImageDerainingModel
scale: 1
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: PairedImageDataset
    dataroot_gt: datasets/DID-Data/train/target
    dataroot_lq: datasets/DID-Data/train/input
    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_hflip: false  # no horizontal flip
    use_rot: false  # no rotation
    geometric_augs: true  # one of 8 rigid transforms applied to the pair

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    ### ------- Training on single fixed-patch size 128x128 ---------
    mini_batch_sizes: [4]
    iters: [300000]
    gt_size: 128
    gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: PairedImageDataset
    dataroot_gt: datasets/DID-Data/test/target
    dataroot_lq: datasets/DID-Data/test/input
    io_backend:
      type: disk

# network structures
network_g:
  type: FGDN
  inp_channels: 3
  out_channels: 3
  dim: 32
  num_blocks: [2,2,3,3]
  heads: [1,2,4,8]
  ffn_expansion_factor: 1.6667
  bias: False
  LayerNorm_type: WithBias

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000
  warmup_iter: -1  # no warm up
  use_grad_clip: true

  ema_decay: false
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1,1]
    eta_mins: [0.0003, 0.000001]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 1e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1e3  # checkpoints every 1k iters (original run used 1e5)
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
